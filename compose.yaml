services: 

  webdev-mysql:
    image: mysql:8.0
    container_name: webdev_a_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3310:3306"
    volumes:
      - webdev_a_mysql_data:/var/lib/mysql
    networks:
      - webdev_a_network
  
  webdev-phpmyadmin:
    image: phpmyadmin
    container_name: webdev_a_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: webdev_a_mysql
    ports:
      - "8083:80"
    networks:
      - webdev_a_network

volumes:
  webdev_a_mysql_data:
networks:
  webdev_a_network: